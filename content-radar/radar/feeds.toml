# Source list for the content radar.
#
# lane   — ai | regulated | genfinance
# weight — trust/signal weight in [0, 1]. Primary sources (regulators, labs,
#          practitioners who ship) outrank aggregators and trade press.
# kind   — rss | hn | arxiv
#
# Every source here is free and keyless. Reddit is deliberately absent:
# unauthenticated .json endpoints were deprecated in May 2026 (403), and OAuth
# registration is approval-gated. See docs/project_spec.md.
#
# Adding a source is a one-entry change; a source that starts failing is
# reported in the brief rather than silently dropped.

