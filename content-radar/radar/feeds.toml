# ------------------------------------------------ Generational finance ----

# MoneySavingExpert and the IFS both return 403 to a self-identifying client.
# They could be reached by sending a browser User-Agent, but that means
# circumventing a deliberate block, so they are replaced rather than spoofed.
# The Guardian, BBC and GOV.UK feeds below cover the same territory — student
# finance, pensions, cost of living — and are happy to be read by a feed reader.

[[source]]
name = "Guardian Money"
kind = "rss"
lane = "genfinance"
weight = 0.8
url = "https://www.theguardian.com/uk/money/rss"

